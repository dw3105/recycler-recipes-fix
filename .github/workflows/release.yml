name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release zips
        run: |
          tools/make_zip.sh 2.0
          tools/make_zip.sh 2.1
      - name: Create checksums
        run: sha256sum build/recycler-recipes-fix_0.1.*.zip build/recycler-recipes-fix_0.2.*.zip > build/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk 'NR == 1 { next } /^-{99}$/ { exit } { print }' changelog.txt)
          gh release create "$GITHUB_REF_NAME" \
            build/recycler-recipes-fix_0.1.*.zip \
            build/recycler-recipes-fix_0.2.*.zip \
            build/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
