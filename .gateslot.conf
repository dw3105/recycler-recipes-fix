# gateslot consumer config for recycler-recipes-fix. Lookup exact by label.
# heavy = one headless Factorio --dump-data run (vanilla + test mod; full 51-mod set is heavier).
# Weights copied from sushi-packer (same headless builds); recalibrate with gateslot calibrate.
unknown-label = refuse
weight.recycler-recipes-fix-mod/heavy = mib=768 cores=1
max.recycler-recipes-fix-mod/heavy = 3
weight.recycler-recipes-fix-mod/agent = mib=1024 cores=0.5
max.recycler-recipes-fix-mod/agent = 4
